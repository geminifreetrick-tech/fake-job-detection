[project]
name = "fjd-notification-mcp"
version = "0.1.0"
description = "Notification MCP server (email via SMTP + websocket fan-out via backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic[email]==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.27.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "respx==0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
