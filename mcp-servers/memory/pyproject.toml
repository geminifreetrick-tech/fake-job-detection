[project]
name = "fjd-memory-mcp"
version = "0.1.0"
description = "Memory MCP server (ChromaDB-backed RAG + user context)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "chromadb==0.5.20",
  "httpx==0.27.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
