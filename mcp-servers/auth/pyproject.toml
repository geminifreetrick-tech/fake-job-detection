[project]
name = "fjd-auth-mcp"
version = "0.1.0"
description = "Authentication MCP server (JWT issuance + user CRUD)"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy==2.0.36",
  "asyncpg==0.30.0",
  "passlib[argon2]==1.7.4",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.0",
  "python-multipart==0.0.17",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
  "aiosqlite==0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
