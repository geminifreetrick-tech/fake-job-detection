[project]
name = "fjd-backend"
version = "0.1.0"
description = "Public API gateway for the Fake Job Detection system"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "httpx==0.27.2",
  "python-multipart==0.0.17",
  "pyjwt==2.10.0",
  "websockets==13.1",
  "email-validator==2.2.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "respx==0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
