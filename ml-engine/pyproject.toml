[project]
name = "fjd-ml-engine"
version = "0.1.0"
description = "ML detection engine: feature pipeline + XGBoost classifier + SHAP + OCR"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "xgboost==2.1.2",
  "shap==0.46.0",
  "joblib==1.4.2",
  "regex==2024.11.6",
  "python-multipart==0.0.17",
  "PyMuPDF==1.24.13",
  "pytesseract==0.3.13",
  "Pillow==11.0.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
  "reportlab==4.2.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
