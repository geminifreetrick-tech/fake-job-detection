name: fjd

x-python-base: &python-base
  restart: unless-stopped
  networks: [fjd-net]
  env_file: [.env]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fjd-net]

  chromadb:
    image: chromadb/chroma:0.5.20
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v2/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [fjd-net]

  auth-mcp:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp-servers/auth/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8700/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

  db-mcp:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp-servers/database/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8500/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

  memory-mcp:
    <<: *python-base
    build:
      context: .
      dockerfile: mcp-servers/memory/Dockerfile
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8200/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  ml-engine:
    <<: *python-base
    build:
      context: .
      dockerfile: ml-engine/Dockerfile
    volumes:
      - mlmodels:/app/model_store
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    <<: *python-base
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      auth-mcp:
        condition: service_healthy
      db-mcp:
        condition: service_healthy
      ml-engine:
        condition: service_healthy
      memory-mcp:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 15

networks:
  fjd-net:
    driver: bridge

volumes:
  pgdata:
  chromadata:
  mlmodels:
